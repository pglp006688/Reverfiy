name: 'Reverfiy'
description: 'Inject a Turnstile-style human verification layer into your static site before deploying to GitHub Pages'
branding:
  icon: 'shield'
  color: 'orange'
inputs:
  path:
    description: 'Path to the HTML file or directory to protect'
    required: false
    default: 'index.html'
  output:
    description: 'Directory to copy the protected site into (optional)'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Inject Reverfiy
      shell: bash
      working-directory: ${{ github.workspace }}
      run: node "${{ github.action_path }}/inject.js" "${{ inputs.path }}" "${{ inputs.output }}"
